<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리딩 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>body{margin:0;background:#F6F1E7;font-family:"Noto Sans KR",sans-serif;color:#1F1D1A}a{color:#1F1D1A}a:hover{color:#2E6B5E}</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1E7; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 12px">
    <a href="Main.dc.html" style="font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 18px; letter-spacing: 0.04em; text-decoration: none">SERVICE</a>
    <div style="display: flex; gap: 14px; font-size: 13px; color: #6B645A"><span>한국어</span><a href="Login.dc.html" style="text-decoration: none; font-weight: 500">로그인</a></div>
  </div>
  <svg width="390" height="12" style="display: block"><defs><pattern id="dots" width="18" height="12" patternUnits="userSpaceOnUse"><rect width="18" height="12" fill="#2E6B5E"></rect><circle cx="9" cy="6" r="4.2" fill="#F2A38E"></circle><circle cx="9" cy="6" r="2.4" fill="#E4572E"></circle><circle cx="9" cy="6" r="0.9" fill="#F4B63A"></circle></pattern></defs><rect width="390" height="12" fill="url(#dots)"></rect></svg>
  <div style="padding: 28px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 26px">내 정보 입력</h1>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">이름<input type="text" placeholder="이름" style="font: inherit; font-size: 15px; padding: 13px 14px; border: 1px solid #CFC4B1; border-radius: 10px; background: #FBF8F2"></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">생년월일<input type="text" placeholder="YYYY-MM-DD" style="font: inherit; font-size: 15px; padding: 13px 14px; border: 1px solid #CFC4B1; border-radius: 10px; background: #FBF8F2"></label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">태어난 시각<input type="text" placeholder="HH:MM" style="font: inherit; font-size: 15px; padding: 13px 14px; border: 1px solid #CFC4B1; border-radius: 10px; background: #FBF8F2"></label>
      <label style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #6B645A"><input type="checkbox">시각을 몰라요 (정오 기준으로 계산)</label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">출생 도시<input type="text" placeholder="도시 검색 (예: Seoul, New York)" style="font: inherit; font-size: 15px; padding: 13px 14px; border: 1px solid #CFC4B1; border-radius: 10px; background: #FBF8F2"></label>
    <fieldset style="border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px"><legend style="font-size: 13px; font-weight: 500; padding: 0; margin-bottom: 6px">성별 <span style="color: #6B645A; font-weight: 400">(대운 방향 계산에 사용)</span></legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; gap: 8px; align-items: center; justify-content: center; padding: 12px; border: 1px solid #1F1D1A; border-radius: 10px; font-size: 14px"><input type="radio" name="g" checked>남</label>
        <label style="display: flex; gap: 8px; align-items: center; justify-content: center; padding: 12px; border: 1px solid #CFC4B1; border-radius: 10px; font-size: 14px"><input type="radio" name="g">여</label>
      </div>
    </fieldset>
    <a href="ReadingResult.dc.html" style="display: block; text-align: center; background: #1F1D1A; color: #F6F1E7; text-decoration: none; font-weight: 700; font-size: 16px; padding: 16px; border-radius: 12px; margin-top: 4px">무료 결과 보기 →</a>
    <span style="font-size: 12px; color: #6B645A; text-align: center">입력한 정보는 이 기기에만 저장돼요</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
