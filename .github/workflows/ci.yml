name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  be:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: saju
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d saju"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prepare .env (CI uses the example values)
        run: make env
      - name: Lint
        run: make lint-be
      - name: Migrate
        run: make migrate
      - name: Test
        run: make test-be

  fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fe/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - name: Install
        working-directory: fe
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: make lint-fe
      - name: Build
        working-directory: fe
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.marinkim.xyz
        run: pnpm build
