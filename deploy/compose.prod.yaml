# 운영 서버(OCI A1)용. 서버의 ~/k-saju 에서 deploy/deploy.sh 가 실행한다.
# 값은 서버의 deploy/.env.prod (커밋 금지)에서 온다. 외부 노출은 nginx(edge 네트워크)만 한다.
name: saju

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: saju-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  api:
    build:
      context: ../be
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14.7}
    image: saju-api:${GIT_SHA:-local}
    container_name: saju-api
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]
    mem_limit: 512m

volumes:
  postgres-data:

networks:
  internal: {}
  edge:
    external: true
