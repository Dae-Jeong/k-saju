[project]
name = "api"
version = "0.1.0"
description = "Backend API starting point"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
